<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KSECRET FX Ticker</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;background:#000;overflow:hidden}
  body{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

  .ticker-wrap{
    position:fixed;inset:0;
    display:flex;align-items:center;
    background:#000;
    border-top:1px solid #1a1a1a;
    border-bottom:1px solid #1a1a1a;
    overflow:hidden;
    white-space:nowrap;
  }

  .live-badge{
    flex:0 0 auto;
    display:flex;align-items:center;gap:8px;
    padding:0 22px 0 20px;
    height:100%;
    background:#000;
    border-right:1px solid #222;
    z-index:2;
  }
  .live-dot{
    width:10px;height:10px;border-radius:50%;
    background:#ff2b3d;
    box-shadow:0 0 8px 2px rgba(255,43,61,.6);
    animation:blink 1.1s ease-in-out infinite;
  }
  .live-text{
    color:#ff2b3d;
    font-weight:800;
    font-size:15px;
    letter-spacing:.12em;
  }
  @keyframes blink{
    0%,100%{opacity:1}
    50%{opacity:.15}
  }

  .ticker-track{
    display:inline-flex;
    align-items:center;
    animation:scroll 26s linear infinite;
    will-change:transform;
  }
  .ticker-wrap:hover .ticker-track{animation-play-state:paused}

  .tick{
    display:inline-flex;align-items:center;gap:10px;
    padding:0 34px;
    font-size:17px;
    font-weight:700;
    color:#e8e8e8;
  }
  .tick .pair{color:#888;font-weight:600;font-size:14px;letter-spacing:.04em}
  .tick .value{font-size:19px}
  .tick .arrow{font-size:15px}
  .up{color:#ff3b3b}
  .down{color:#3b82ff}
  .neutral{color:#888}

  @keyframes scroll{
    from{transform:translateX(0)}
    to{transform:translateX(-50%)}
  }

  @media(prefers-reduced-motion:reduce){
    .ticker-track{animation:none}
    .live-dot{animation:none}
  }
</style>
</head>
<body>
<div class="ticker-wrap" aria-label="실시간 환율 티커">
  <div class="live-badge">
    <span class="live-dot" aria-hidden="true"></span>
    <span class="live-text">LIVE</span>
  </div>
  <div class="ticker-track" id="tickerTrack"></div>
</div>
<script>
const pairs=[
  {key:'USD/KRW', code:'USD'},
  {key:'JPY/KRW', code:'JPY'},
  {key:'EUR/KRW', code:'EUR'},
  {key:'AED/KRW', code:'AED'}
];
let previous={};
const track=document.getElementById('tickerTrack');

function fmt(n){
  return Number(n).toLocaleString('ko-KR',{minimumFractionDigits:2,maximumFractionDigits:2});
}

function render(rows){
  const one=rows.map(r=>{
    const dir = r.delta>0?'up':r.delta<0?'down':'neutral';
    const arrow = r.delta>0?'▲':r.delta<0?'▼':'—';
    return `<span class="tick">
      <span class="pair">${r.key}</span>
      <span class="value ${dir}">${fmt(r.value)}</span>
      <span class="arrow ${dir}">${arrow}</span>
    </span>`;
  }).join('');
  // duplicate for seamless loop
  track.innerHTML = one + one;
}

async function load(){
  const endpoints=[
    'https://api.exchangerate-api.com/v4/latest/USD',
    'https://open.er-api.com/v6/latest/USD'
  ];
  let data=null;
  for(const ep of endpoints){
    try{
      const res=await fetch(ep,{cache:'no-store'});
      if(!res.ok) continue;
      const cand=await res.json();
      if(cand.rates?.KRW){ data=cand; break; }
    }catch(e){}
  }
  if(!data) return;
  const krw=data.rates.KRW;
  const rows=pairs.map(p=>{
    const value = p.code==='USD' ? krw : krw/data.rates[p.code];
    const old = previous[p.key];
    const delta = old ? value-old : 0;
    previous[p.key]=value;
    return {...p, value, delta};
  });
  render(rows);
}

load();
setInterval(load, 15000);
</script>
</body>
</html>
